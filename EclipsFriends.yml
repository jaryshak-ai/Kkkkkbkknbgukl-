name: Build EclipsFriends

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create project files
        run: |
          set -e
          mkdir -p src/main/java/ru/eclips/friends src/main/resources
          cat > pom.xml <<'EOF_POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>

              <groupId>ru.eclips</groupId>
              <artifactId>EclipsFriends</artifactId>
              <version>1.0.0</version>
              <packaging>jar</packaging>

              <properties>
                  <maven.compiler.source>17</maven.compiler.source>
                  <maven.compiler.target>17</maven.compiler.target>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <repositories>
                  <repository>
                      <id>lanink</id>
                      <url>https://repo.lanink.cn/repository/maven-public/</url>
                  </repository>
              </repositories>

              <dependencies>
                  <dependency>
                      <groupId>cn.nukkit</groupId>
                      <artifactId>Nukkit</artifactId>
                      <version>MOT-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>

              <build>
                  <finalName>EclipsFriends</finalName>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.11.0</version>
                          <configuration>
                              <release>17</release>
                              <encoding>UTF-8</encoding>
                          </configuration>
                      </plugin>
                  </plugins>
              </build>
          </project>
          EOF_POM
          cat > src/main/resources/plugin.yml <<'EOF_PLUGIN'
          name: EclipsFriends
          main: ru.eclips.friends.FriendsPlugin
          version: "1.0.0"
          api: ["1.0.0"]
          author: Eclips
          description: Друзья и огоньки (серии с другом) для сервера Eclips
          softdepend: [TpCoins]

          permissions:
            eclipsfriends.admin:
              description: Статистика огоньков (/af)
              default: op
            eclipsfriends.invis.hide:
              description: Игрока с этим правом никогда не подсвечивают друзьям в невидимости (для персонала)
              default: false
          EOF_PLUGIN
          cat > src/main/resources/config.yml <<'EOF_CONFIG'
          # EclipsFriends: друзья и огоньки. После изменения перезапусти сервер.
          # Цвета не нужны: тексты форм уже подобраны читаемыми на тёмном и светлом фоне.

          # Часовой пояс, по которому считается сутки (новый день начинается в 00:00 по нему).
          # Москва: Europe/Moscow
          timezone: "Europe/Moscow"

          limits:
            # Максимум огоньков у одного игрока
            max-sparks: 5
            # Максимум друзей у одного игрока
            max-friends: 15
            # Сколько неотвеченных приглашений может висеть у одного игрока
            max-incoming-invites: 10
            # Сколько дней живёт приглашение (потом удаляется само)
            invite-lifetime-days: 7
            # Пауза в минутах перед повторным приглашением того же игрока после отказа (0 = без паузы)
            invite-cooldown-minutes: 10

          antiabuse:
            # Сколько минут нужно наиграть на сервере (с момента установки плагина) каждому из двоих,
            # чтобы начать огонёк. 0 = без ограничения
            min-playtime-minutes: 60
            # Запретить огонёк игрокам с одинаковым IP (защита от фарма альтами)
            block-same-ip: true

          # За сколько часов до конца дня напомнить игроку, что огонёк скоро сгорит (0 = не напоминать)
          warn-hours-before-loss: 3

          # Награда каждому из двоих за день огонька (монеты TpCoins).
          # Огонёк "старше N дней", когда серия больше N.
          reward:
            base: 500
            tier1-older-than-days: 7
            tier1-coins: 700
            tier2-older-than-days: 14
            tier2-coins: 800
            tier3-older-than-days: 30
            tier3-coins: 1000

          gifts:
            # Сколько слотов можно использовать в одном подарке (от 1 до 9)
            max-slots: 9
            # Сколько неполученных подарков может ждать одного игрока (от 1 до 20)
            max-unclaimed: 20
            # Через сколько дней невзятый подарок возвращается отправителю
            return-after-days: 14
            # Включена ли анонимность по умолчанию (игрок может переключить её в сундуке)
            default-anonymous: false
            # Предметы, которые нельзя дарить (названия как в игре)
            banned-items:
              - bedrock
              - command_block
              - repeating_command_block
              - chain_command_block
              - barrier
              - structure_block
              - end_portal_frame

          messages:
            # Сколько анонимных сообщений можно отправить за день (всего, разным друзьям или одному)
            daily-limit: 5
            # Максимальная длина сообщения и ответа в символах
            max-length: 150
            # Сколько дней хранятся сообщения (жалобы без ответа админа хранятся дольше)
            keep-days: 14
            # Сколько сообщений максимум хранится у одного игрока (старые удаляются)
            max-stored: 30
            # Писать ли анонимные сообщения и ответы в консоль сервера (для модерации)
            log-to-console: true

          # Подсветка невидимых друзей: друзья игрока под эффектом невидимости видят вокруг него
          # зелёные частицы и его ник над головой. Остальные игроки ничего не видят.
          invisibility:
            enabled: true
            # Радиус в блоках (в пределах одного мира)
            radius: 32
            # Как часто обновлять подсветку, в тиках (20 тиков = 1 секунда)
            interval-ticks: 5
            # Зелёные частицы вокруг невидимого друга
            particles: true
            # Ник над головой невидимого друга
            name-tag: true
            # Цвет ника
            name-color: "§a"
            # Миры, где подсветка отключена (названия папок миров). Укажи сюда мир с дуэлями,
            # если плагин Duel не определился автоматически.
            disabled-worlds: []

          texts:
            # Текст кнопки "Что такое огонёк" (под ним плагин сам добавит таблицу наград)
            what-is-spark: "Расти огонёк вместе со своим другом и вы оба будете получать монеты! Чем дольше ваш огонёк, тем больше монет! Если один из вас не продлит огонёк, вы потеряете серию."
          EOF_CONFIG
          cat > src/main/java/ru/eclips/friends/Store.java <<'EOF_STORE'
          package ru.eclips.friends;

          import cn.nukkit.utils.Config;

          import java.io.File;
          import java.nio.file.Files;
          import java.nio.file.StandardCopyOption;
          import java.util.ArrayList;
          import java.util.Collection;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.TimeUnit;

          /** Хранилище данных: друзья, огоньки, приглашения. Запись на диск идёт в отдельном потоке. */
          final class Store {

              static final class PD {
                  String key = "";
                  String name = "";
                  String ip = "";
                  long playSec = 0;
                  long pending = 0;
                  long lastSeen = 0;
                  long msgDay = 0;
                  int msgCount = 0;
                  final List<String> friends = new ArrayList<>();
                  final List<String> notices = new ArrayList<>();
              }

              static final class Spark {
                  String a = "";
                  String b = "";
                  String an = "";
                  String bn = "";
                  int streak = 0;
                  long start = 0;
                  long lastDone = 0;
                  long lastA = -1;
                  long lastB = -1;

                  String id() { return a + "|" + b; }
                  boolean isA(String k) { return a.equals(k); }
                  String other(String k) { return isA(k) ? b : a; }
                  String otherName(String k) { return isA(k) ? bn : an; }
                  long last(String k) { return isA(k) ? lastA : lastB; }
                  void setLast(String k, long day) { if (isA(k)) lastA = day; else lastB = day; }
              }

              static final class Inv {
                  String type = "friend";
                  String from = "";
                  String fromName = "";
                  String to = "";
                  String toName = "";
                  long created = 0;
              }

              /** Событие для статистики: created (огонёк создан) или died (огонёк умер). */
              static final class Ev {
                  String type = "";
                  long time = 0;
              }

              final List<Ev> events = new ArrayList<>();

              /** Подарок: предметы хранятся в виде строк (см. GiftUi.ser/de). */
              static final class Gift {
                  long id = 0;
                  String from = "";
                  String fromName = "";
                  String to = "";
                  String toName = "";
                  boolean anon = false;
                  boolean returned = false;
                  long created = 0;
                  final List<String> items = new ArrayList<>();
              }

              /** Сообщение: type = anon (анонимное) или reply (ответ). */
              static final class Msg {
                  long id = 0;
                  String type = "anon";
                  String from = "";
                  String fromName = "";
                  String to = "";
                  String toName = "";
                  String text = "";
                  long created = 0;
                  boolean read = false;
                  boolean replied = false;
                  boolean reported = false;
                  boolean handled = false;
              }

              final List<Gift> gifts = new ArrayList<>();
              final List<Msg> msgs = new ArrayList<>();
              private long lastId = 0;

              long newId() {
                  long id = Math.max(lastId + 1, System.currentTimeMillis());
                  lastId = id;
                  return id;
              }

              /** Неполученные подарки игрока, старые первыми. */
              List<Gift> giftsFor(String to) {
                  List<Gift> r = new ArrayList<>();
                  for (Gift g : gifts) {
                      if (g.to.equals(to)) r.add(g);
                  }
                  r.sort((x, y) -> Long.compare(x.created, y.created));
                  return r;
              }

              Gift findGift(long id) {
                  for (Gift g : gifts) {
                      if (g.id == id) return g;
                  }
                  return null;
              }

              Msg findMsg(long id) {
                  for (Msg m : msgs) {
                      if (m.id == id) return m;
                  }
                  return null;
              }

              final Map<String, PD> players = new LinkedHashMap<>();
              final List<Spark> sparks = new ArrayList<>();
              final List<Inv> invites = new ArrayList<>();

              private final FriendsPlugin pl;
              private final File file;
              private final File tmp;
              private final ExecutorService io;
              private final Object lock = new Object();
              private volatile boolean dirty = false;

              Store(FriendsPlugin pl, File file) {
                  this.pl = pl;
                  this.file = file;
                  this.tmp = new File(file.getParentFile(), "data.yml.tmp");
                  this.io = Executors.newSingleThreadExecutor(r -> {
                      Thread t = new Thread(r, "EclipsFriends-IO");
                      t.setDaemon(true);
                      return t;
                  });
              }

              void dirty() { dirty = true; }

              void event(String type) {
                  Ev e = new Ev();
                  e.type = type;
                  e.time = System.currentTimeMillis();
                  events.add(e);
                  dirty = true;
              }

              int countEvents(String type, long sinceMs) {
                  int c = 0;
                  for (Ev e : events) {
                      if (e.type.equals(type) && e.time >= sinceMs) c++;
                  }
                  return c;
              }

              void pruneEvents(long olderThanMs) {
                  if (events.removeIf(e -> e.time < olderThanMs)) dirty = true;
              }

              PD ensure(String key, String name) {
                  PD d = players.get(key);
                  if (d == null) {
                      d = new PD();
                      d.key = key;
                      d.name = name == null ? key : name;
                      players.put(key, d);
                      dirty = true;
                  } else if (name != null && !name.isEmpty() && !name.equals(d.name)) {
                      d.name = name;
                      dirty = true;
                  }
                  return d;
              }

              // ---------- чтение ----------

              private static String s(Map<?, ?> m, String k) {
                  Object o = m.get(k);
                  return o == null ? "" : String.valueOf(o);
              }

              private static long n(Map<?, ?> m, String k, long def) {
                  Object o = m.get(k);
                  return (o instanceof Number) ? ((Number) o).longValue() : def;
              }

              private static List<String> strs(Map<?, ?> m, String k) {
                  List<String> r = new ArrayList<>();
                  Object o = m.get(k);
                  if (o instanceof Collection) {
                      for (Object x : (Collection<?>) o) {
                          if (x != null) r.add(String.valueOf(x));
                      }
                  }
                  return r;
              }

              private static List<Map<?, ?>> maps(Map<?, ?> m, String k) {
                  List<Map<?, ?>> r = new ArrayList<>();
                  Object o = m.get(k);
                  if (o instanceof Collection) {
                      for (Object x : (Collection<?>) o) {
                          if (x instanceof Map) r.add((Map<?, ?>) x);
                      }
                  }
                  return r;
              }

              void load() {
                  try {
                      if (!file.exists()) return;
                      Config c = new Config(file, Config.YAML);
                      Map<String, Object> all = c.getAll();
                      for (Map<?, ?> m : maps(all, "players")) {
                          PD d = new PD();
                          d.key = s(m, "key");
                          if (d.key.isEmpty()) continue;
                          d.name = s(m, "name");
                          d.ip = s(m, "ip");
                          d.playSec = n(m, "play-seconds", 0);
                          d.pending = n(m, "pending", 0);
                          d.lastSeen = n(m, "last-seen", 0);
                          d.msgDay = n(m, "msg-day", 0);
                          d.msgCount = (int) n(m, "msg-count", 0);
                          d.friends.addAll(strs(m, "friends"));
                          d.notices.addAll(strs(m, "notices"));
                          players.put(d.key, d);
                      }
                      for (Map<?, ?> m : maps(all, "sparks")) {
                          Spark sp = new Spark();
                          sp.a = s(m, "a");
                          sp.b = s(m, "b");
                          if (sp.a.isEmpty() || sp.b.isEmpty()) continue;
                          sp.an = s(m, "a-name");
                          sp.bn = s(m, "b-name");
                          sp.streak = (int) n(m, "streak", 0);
                          sp.start = n(m, "start", 0);
                          sp.lastDone = n(m, "last-done", 0);
                          sp.lastA = n(m, "last-a", -1);
                          sp.lastB = n(m, "last-b", -1);
                          sparks.add(sp);
                      }
                      for (Map<?, ?> m : maps(all, "events")) {
                          Ev ev = new Ev();
                          ev.type = s(m, "type");
                          ev.time = n(m, "time", 0);
                          if (!ev.type.isEmpty()) events.add(ev);
                      }
                      for (Map<?, ?> m : maps(all, "gifts")) {
                          Gift g = new Gift();
                          g.id = n(m, "id", 0);
                          g.from = s(m, "from");
                          g.fromName = s(m, "from-name");
                          g.to = s(m, "to");
                          g.toName = s(m, "to-name");
                          g.anon = Boolean.parseBoolean(s(m, "anon"));
                          g.returned = Boolean.parseBoolean(s(m, "returned"));
                          g.created = n(m, "created", 0);
                          g.items.addAll(strs(m, "items"));
                          if (g.to.isEmpty()) continue;
                          lastId = Math.max(lastId, g.id);
                          gifts.add(g);
                      }
                      for (Map<?, ?> m : maps(all, "messages")) {
                          Msg x = new Msg();
                          x.id = n(m, "id", 0);
                          x.type = s(m, "type");
                          x.from = s(m, "from");
                          x.fromName = s(m, "from-name");
                          x.to = s(m, "to");
                          x.toName = s(m, "to-name");
                          x.text = s(m, "text");
                          x.created = n(m, "created", 0);
                          x.read = Boolean.parseBoolean(s(m, "read"));
                          x.replied = Boolean.parseBoolean(s(m, "replied"));
                          x.reported = Boolean.parseBoolean(s(m, "reported"));
                          x.handled = Boolean.parseBoolean(s(m, "handled"));
                          if (x.to.isEmpty()) continue;
                          lastId = Math.max(lastId, x.id);
                          msgs.add(x);
                      }
                      if (!all.containsKey("events")) {
                          // первая загрузка после обновления: восстанавливаем «создан» для живых огоньков
                          for (Spark sp : sparks) {
                              Ev ev = new Ev();
                              ev.type = "created";
                              ev.time = sp.start * 86400000L;
                              events.add(ev);
                          }
                          dirty = true;
                      }
                      for (Map<?, ?> m : maps(all, "invites")) {
                          Inv iv = new Inv();
                          iv.type = s(m, "type");
                          iv.from = s(m, "from");
                          iv.fromName = s(m, "from-name");
                          iv.to = s(m, "to");
                          iv.toName = s(m, "to-name");
                          iv.created = n(m, "created", 0);
                          if (iv.from.isEmpty() || iv.to.isEmpty()) continue;
                          invites.add(iv);
                      }
                  } catch (Throwable t) {
                      try {
                          Files.copy(file.toPath(), new File(file.getParentFile(), "data.yml.broken").toPath(),
                                  StandardCopyOption.REPLACE_EXISTING);
                      } catch (Throwable ignored) {
                      }
                      pl.getLogger().warning("Не удалось прочитать data.yml: " + t);
                  }
              }

              // ---------- запись ----------

              private LinkedHashMap<String, Object> snapshot() {
                  LinkedHashMap<String, Object> root = new LinkedHashMap<>();
                  List<Object> ps = new ArrayList<>();
                  for (PD d : players.values()) {
                      LinkedHashMap<String, Object> m = new LinkedHashMap<>();
                      m.put("key", d.key);
                      m.put("name", d.name);
                      m.put("ip", d.ip);
                      m.put("play-seconds", d.playSec);
                      m.put("pending", d.pending);
                      m.put("last-seen", d.lastSeen);
                      m.put("msg-day", d.msgDay);
                      m.put("msg-count", d.msgCount);
                      m.put("friends", new ArrayList<>(d.friends));
                      m.put("notices", new ArrayList<>(d.notices));
                      ps.add(m);
                  }
                  root.put("players", ps);
                  List<Object> ss = new ArrayList<>();
                  for (Spark sp : sparks) {
                      LinkedHashMap<String, Object> m = new LinkedHashMap<>();
                      m.put("a", sp.a);
                      m.put("b", sp.b);
                      m.put("a-name", sp.an);
                      m.put("b-name", sp.bn);
                      m.put("streak", sp.streak);
                      m.put("start", sp.start);
                      m.put("last-done", sp.lastDone);
                      m.put("last-a", sp.lastA);
                      m.put("last-b", sp.lastB);
                      ss.add(m);
                  }
                  root.put("sparks", ss);
                  List<Object> is = new ArrayList<>();
                  for (Inv iv : invites) {
                      LinkedHashMap<String, Object> m = new LinkedHashMap<>();
                      m.put("type", iv.type);
                      m.put("from", iv.from);
                      m.put("from-name", iv.fromName);
                      m.put("to", iv.to);
                      m.put("to-name", iv.toName);
                      m.put("created", iv.created);
                      is.add(m);
                  }
                  root.put("invites", is);
                  List<Object> es = new ArrayList<>();
                  for (Ev ev : events) {
                      LinkedHashMap<String, Object> m = new LinkedHashMap<>();
                      m.put("type", ev.type);
                      m.put("time", ev.time);
                      es.add(m);
                  }
                  root.put("events", es);
                  List<Object> gs = new ArrayList<>();
                  for (Gift g : gifts) {
                      LinkedHashMap<String, Object> m = new LinkedHashMap<>();
                      m.put("id", g.id);
                      m.put("from", g.from);
                      m.put("from-name", g.fromName);
                      m.put("to", g.to);
                      m.put("to-name", g.toName);
                      m.put("anon", g.anon);
                      m.put("returned", g.returned);
                      m.put("created", g.created);
                      m.put("items", new ArrayList<>(g.items));
                      gs.add(m);
                  }
                  root.put("gifts", gs);
                  List<Object> ms = new ArrayList<>();
                  for (Msg x : msgs) {
                      LinkedHashMap<String, Object> m = new LinkedHashMap<>();
                      m.put("id", x.id);
                      m.put("type", x.type);
                      m.put("from", x.from);
                      m.put("from-name", x.fromName);
                      m.put("to", x.to);
                      m.put("to-name", x.toName);
                      m.put("text", x.text);
                      m.put("created", x.created);
                      m.put("read", x.read);
                      m.put("replied", x.replied);
                      m.put("reported", x.reported);
                      m.put("handled", x.handled);
                      ms.add(m);
                  }
                  root.put("messages", ms);
                  return root;
              }

              private void write(LinkedHashMap<String, Object> snap) {
                  synchronized (lock) {
                      try {
                          File dir = file.getParentFile();
                          if (dir != null) dir.mkdirs();
                          if (tmp.exists()) tmp.delete();
                          Config c = new Config(tmp, Config.YAML);
                          c.setAll(snap);
                          c.save();
                          try {
                              Files.move(tmp.toPath(), file.toPath(), StandardCopyOption.REPLACE_EXISTING,
                                      StandardCopyOption.ATOMIC_MOVE);
                          } catch (Throwable e) {
                              Files.move(tmp.toPath(), file.toPath(), StandardCopyOption.REPLACE_EXISTING);
                          }
                      } catch (Throwable t) {
                          dirty = true;
                          pl.getLogger().warning("Не удалось сохранить data.yml: " + t);
                      }
                  }
              }

              /** Вызывается из главного потока: снимок данных делается сразу, запись идёт в фоне. */
              void flush() {
                  if (!dirty) return;
                  dirty = false;
                  final LinkedHashMap<String, Object> snap = snapshot();
                  try {
                      io.execute(() -> write(snap));
                  } catch (Throwable t) {
                      write(snap);
                  }
              }

              /** При выключении сервера: дожидаемся фоновых записей и сохраняем остаток. */
              void close() {
                  try {
                      io.shutdown();
                      io.awaitTermination(10, TimeUnit.SECONDS);
                  } catch (Throwable ignored) {
                  }
                  if (dirty) {
                      dirty = false;
                      write(snapshot());
                  }
              }
          }
          EOF_STORE
          cat > src/main/java/ru/eclips/friends/Econ.java <<'EOF_ECON'
          package ru.eclips.friends;

          import cn.nukkit.Player;
          import cn.nukkit.plugin.Plugin;

          import java.lang.reflect.Method;

          /** Мост к плагину TpCoins через рефлексию: если API не совпадёт, сработает запасной вариант. */
          final class Econ {

              private final FriendsPlugin pl;

              Econ(FriendsPlugin pl) {
                  this.pl = pl;
              }

              private Object eco() {
                  try {
                      Plugin p = pl.getServer().getPluginManager().getPlugin("TpCoins");
                      if (p == null || !p.isEnabled()) return null;
                      Method m = p.getClass().getMethod("getEconomy");
                      m.setAccessible(true);
                      return m.invoke(p);
                  } catch (Throwable t) {
                      return null;
                  }
              }

              private static Object call(Object target, String name, Class<?>[] types, Object... args) throws Exception {
                  Method m = target.getClass().getMethod(name, types);
                  m.setAccessible(true);
                  return m.invoke(target, args);
              }

              /** Есть ли у игрока счёт в TpCoins (то есть заходил ли он на сервер). */
              boolean has(String key) {
                  try {
                      Object e = eco();
                      if (e == null) return false;
                      return Boolean.TRUE.equals(call(e, "hasAccount", new Class<?>[]{String.class}, key));
                  } catch (Throwable t) {
                      return false;
                  }
              }

              /** Отображаемое имя игрока из TpCoins или null. */
              String nameOf(String key) {
                  try {
                      Object e = eco();
                      if (e == null) return null;
                      Object r = call(e, "getName", new Class<?>[]{String.class}, key);
                      return r == null ? null : String.valueOf(r);
                  } catch (Throwable t) {
                      return null;
                  }
              }

              private long bal(Object e, String key) {
                  try {
                      Object r = call(e, "getBalance", new Class<?>[]{String.class}, key);
                      return (r instanceof Number) ? ((Number) r).longValue() : -1;
                  } catch (Throwable t) {
                      return -1;
                  }
              }

              /**
               * Выдаёт монеты игроку. Возвращает сколько реально выдано (0 если баланс полон),
               * либо -1 если выдать не получилось ни одним способом.
               */
              long pay(Player p, long want) {
                  try {
                      Object e = eco();
                      if (e == null) return -1;
                      String key = FriendsPlugin.key(p.getName());
                      try {
                          call(e, "ensureAccount", new Class<?>[]{Player.class}, p);
                      } catch (Throwable ignored) {
                      }
                      long room = Long.MAX_VALUE;
                      try {
                          Object r = call(e, "getRoom", new Class<?>[]{String.class}, key);
                          if (r instanceof Number) room = ((Number) r).longValue();
                      } catch (Throwable ignored) {
                      }
                      long amt = Math.min(want, room);
                      if (amt <= 0) return 0;

                      // Вариант 1: прямой вызов deposit(String, long, String)
                      try {
                          long b0 = bal(e, key);
                          Object r = call(e, "deposit", new Class<?>[]{String.class, long.class, String.class},
                                  key, amt, "Огоньки");
                          boolean ok = "OK".equals(String.valueOf(r));
                          long b1 = bal(e, key);
                          if (ok || (b0 >= 0 && b1 - b0 >= amt)) return amt;
                      } catch (Throwable ignored) {
                      }

                      // Вариант 2: команда /givem от консоли с проверкой, что баланс вырос
                      try {
                          long b0 = bal(e, key);
                          String nm = p.getName();
                          String arg = nm.indexOf(' ') >= 0 ? "\"" + nm + "\"" : nm;
                          pl.getServer().dispatchCommand(pl.getServer().getConsoleSender(), "givem " + arg + " " + amt);
                          long b1 = bal(e, key);
                          if (b0 >= 0 && b1 - b0 >= amt) return amt;
                      } catch (Throwable ignored) {
                      }
                      return -1;
                  } catch (Throwable t) {
                      return -1;
                  }
              }

              long balance(Player p) {
                  try {
                      Object e = eco();
                      if (e == null) return -1;
                      return bal(e, FriendsPlugin.key(p.getName()));
                  } catch (Throwable t) {
                      return -1;
                  }
              }
          }
