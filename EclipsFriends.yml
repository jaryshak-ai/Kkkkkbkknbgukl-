                  t1d = getConfig().getInt("reward.tier1-older-than-days", 7);
                  t1c = getConfig().getInt("reward.tier1-coins", 700);
                  t2d = getConfig().getInt("reward.tier2-older-than-days", 14);
                  t2c = getConfig().getInt("reward.tier2-coins", 800);
                  t3d = getConfig().getInt("reward.tier3-older-than-days", 30);
                  t3c = getConfig().getInt("reward.tier3-coins", 1000);
                  whatText = getConfig().getString("texts.what-is-spark", "");
                  giftMaxUnclaimed = Math.max(1, Math.min(20, getConfig().getInt("gifts.max-unclaimed", 20)));
                  giftReturnDays = Math.max(1, getConfig().getInt("gifts.return-after-days", 14));
                  giftDefaultAnon = getConfig().getBoolean("gifts.default-anonymous", false);
                  msgLimit = Math.max(1, getConfig().getInt("messages.daily-limit", 5));
                  msgMax = Math.max(10, getConfig().getInt("messages.max-length", 150));
                  msgKeepDays = Math.max(1, getConfig().getInt("messages.keep-days", 14));
                  msgStored = Math.max(1, getConfig().getInt("messages.max-stored", 30));
                  msgLog = getConfig().getBoolean("messages.log-to-console", true);
              }

              // ================== утилиты ==================

              boolean isAdmin(CommandSender s) {
                  try {
                      return s.isOp() || s.hasPermission("eclipsfriends.admin");
                  } catch (Throwable t) {
                      return false;
                  }
              }

              static String key(String name) {
                  return name == null ? "" : name.trim().toLowerCase(Locale.ROOT).replace(' ', '_');
              }

              static String fmt(long n) {
                  String s = Long.toString(Math.abs(n));
                  StringBuilder b = new StringBuilder();
                  int c = 0;
                  for (int i = s.length() - 1; i >= 0; i--) {
                      b.append(s.charAt(i));
                      if (++c % 3 == 0 && i > 0) b.append(' ');
                  }
                  return (n < 0 ? "-" : "") + b.reverse();
              }

              long today() {
                  return LocalDate.now(zone).toEpochDay();
              }

              long reward(int streak) {
                  if (streak > t3d) return t3c;
                  if (streak > t2d) return t2c;
                  if (streak > t1d) return t1c;
                  return rBase;
              }

              Player online(String k) {
                  for (Player p : getServer().getOnlinePlayers().values()) {
                      if (key(p.getName()).equals(k)) return p;
                  }
                  return null;
              }

              /** Сообщение игроку: онлайн — сразу, офлайн — сохраняется и покажется при входе. */
              void notifyPlayer(String k, String text) {
                  Player p = online(k);
                  if (p != null) {
                      p.sendMessage(PFX + text);
                      try {
                          p.sendTip(text);
                      } catch (Throwable ignored) {
                      }
                  } else {
                      Store.PD d = st.players.get(k);
                      if (d != null) {
                          d.notices.add(text);
                          while (d.notices.size() > 20) d.notices.remove(0);
                          st.dirty();
                      }
                  }
              }

              static String sparkId(String a, String b) {
                  return a.compareTo(b) <= 0 ? a + "|" + b : b + "|" + a;
              }

              Store.Spark spark(String a, String b) {
                  String id = sparkId(a, b);
                  for (Store.Spark s : st.sparks) {
                      if (s.id().equals(id)) return s;
                  }
                  return null;
              }

              List<Store.Spark> sparksOf(String k) {
                  List<Store.Spark> r = new ArrayList<>();
                  for (Store.Spark s : st.sparks) {
                      if (s.a.equals(k) || s.b.equals(k)) r.add(s);
                  }
                  return r;
              }

              Store.Inv findInv(String type, String from, String to) {
                  for (Store.Inv i : st.invites) {
                      if (i.type.equals(type) && i.from.equals(from) && i.to.equals(to)) return i;
                  }
                  return null;
              }

              List<Store.Inv> incoming(String k) {
                  List<Store.Inv> r = new ArrayList<>();
                  for (Store.Inv i : st.invites) {
                      if (i.to.equals(k)) r.add(i);
                  }
                  return r;
              }

              String left(Store.Spark s) {
                  long dl = LocalDate.ofEpochDay(s.lastDone + 2).atStartOfDay(zone).toInstant().toEpochMilli();
                  long ms = Math.max(0, dl - System.currentTimeMillis());
                  long h = ms / 3600000L;
                  long m = (ms / 60000L) % 60;
                  if (h >= 24) return (h / 24) + " д. " + (h % 24) + " ч.";
                  return h + " ч. " + m + " мин.";
              }

              /** Находит игрока по нику: онлайн, в данных плагина, в TpCoins. Возвращает {ключ, имя} или null. */
              String[] resolve(String input) {
                  if (input == null) return null;
                  String k = key(input);
                  if (k.isEmpty()) return null;
                  Player op = online(k);
                  if (op != null) return new String[]{k, op.getName()};
                  Store.PD d = st.players.get(k);
                  if (d != null) return new String[]{k, d.name};
                  String nm = null;
                  if (econ.has(k)) nm = econ.nameOf(k);
                  if (nm != null && !nm.isEmpty()) return new String[]{k, nm};
                  Player found = null;
                  int cnt = 0;
                  for (Player p : getServer().getOnlinePlayers().values()) {
                      if (key(p.getName()).startsWith(k)) {
                          found = p;
                          cnt++;
                      }
                  }
                  if (cnt == 1) return new String[]{key(found.getName()), found.getName()};
                  return null;
              }

              // ================== логика друзей ==================

              String inviteFriend(Player p, String tk, String tn) {
                  String me = key(p.getName());
                  Store.PD my = st.ensure(me, p.getName());
                  if (tk.equals(me)) return "Нельзя добавить в друзья самого себя.";
                  Store.PD t = st.players.get(tk);
                  if (t == null) t = st.ensure(tk, tn);
                  if (my.friends.contains(tk)) return t.name + " уже у тебя в друзьях.";
                  if (my.friends.size() >= maxFriends) return "У тебя максимум друзей (" + maxFriends + ").";
                  if (t.friends.size() >= maxFriends) return "У игрока " + t.name + " уже максимум друзей.";
                  if (findInv("friend", me, tk) != null) return "Приглашение игроку " + t.name + " уже отправлено.";
                  Store.Inv rev = findInv("friend", tk, me);
                  if (rev != null) return acceptInv(p, rev);
                  Long cd = declined.get(me + ">" + tk + ">friend");
                  if (cd != null && System.currentTimeMillis() < cd) {
                      return "Подожди немного перед повторным приглашением этому игроку.";
                  }
                  if (incoming(tk).size() >= maxIncoming) return "У игрока " + t.name + " слишком много неотвеченных приглашений.";
                  Store.Inv iv = new Store.Inv();
                  iv.type = "friend";
                  iv.from = me;
                  iv.fromName = p.getName();
                  iv.to = tk;
                  iv.toName = t.name;
                  iv.created = System.currentTimeMillis();
                  st.invites.add(iv);
                  st.dirty();
                  notifyPlayer(tk, "§e" + p.getName() + " §rприглашает тебя в друзья. Открой §a/friend §r→ «Мои приглашения».");
                  return "Приглашение в друзья отправлено игроку " + t.name + ".";
              }

              String checkSpark(String a, String b) {
                  Store.PD x = st.players.get(a);
                  Store.PD y = st.players.get(b);
                  if (x == null || y == null) return "Игрок не найден.";
                  if (!x.friends.contains(b) || !y.friends.contains(a)) return "Огонёк можно начать только с другом.";
                  if (spark(a, b) != null) return "Огонёк с этим игроком уже есть.";
                  if (sparksOf(a).size() >= maxSparks) return x.name + ": уже максимум огоньков (" + maxSparks + ").";
                  if (sparksOf(b).size() >= maxSparks) return y.name + ": уже максимум огоньков (" + maxSparks + ").";
                  if (sameIp && !x.ip.isEmpty() && x.ip.equals(y.ip)) {
                      return "Огонёк недоступен игрокам с одинаковым IP-адресом.";
                  }
                  long need = minPlayMin * 60L;
                  if (x.playSec < need) {
                      return x.name + ": нужно наиграть минимум " + minPlayMin + " мин. (сейчас " + (x.playSec / 60) + ").";
                  }
                  if (y.playSec < need) {
                      return y.name + ": нужно наиграть минимум " + minPlayMin + " мин. (сейчас " + (y.playSec / 60) + ").";
                  }
                  return null;
              }

              String inviteSpark(Player p, String tk) {
                  String me = key(p.getName());
                  Store.PD my = st.ensure(me, p.getName());
                  Store.PD t = st.players.get(tk);
                  if (t == null) return "Игрок не найден.";
                  String er = checkSpark(me, tk);
                  if (er != null) return er;
                  if (findInv("spark", me, tk) != null) return "Приглашение на огонёк игроку " + t.name + " уже отправлено.";
                  Store.Inv rev = findInv("spark", tk, me);
                  if (rev != null) return acceptInv(p, rev);
                  Long cd = declined.get(me + ">" + tk + ">spark");
                  if (cd != null && System.currentTimeMillis() < cd) {
                      return "Подожди немного перед повторным приглашением этому игроку.";
                  }
                  if (incoming(tk).size() >= maxIncoming) return "У игрока " + t.name + " слишком много неотвеченных приглашений.";
                  Store.Inv iv = new Store.Inv();
                  iv.type = "spark";
                  iv.from = me;
                  iv.fromName = my.name;
                  iv.to = tk;
                  iv.toName = t.name;
                  iv.created = System.currentTimeMillis();
                  st.invites.add(iv);
                  st.dirty();
                  notifyPlayer(tk, "§e" + p.getName() + " §rзовёт тебя начать огонёк! Открой §a/friend §r→ «Мои приглашения».");
                  return "Приглашение на огонёк отправлено игроку " + t.name + ".";
              }

              String acceptInv(Player p, Store.Inv inv) {
                  st.invites.remove(inv);
                  st.dirty();
                  String me = key(p.getName());
                  if (!inv.to.equals(me)) return "Это приглашение не для тебя.";
                  Store.PD b = st.ensure(me, p.getName());
                  Store.PD a = st.ensure(inv.from, inv.fromName);
                  if (inv.type.equals("friend")) {
                      if (a.friends.contains(me) || b.friends.contains(inv.from)) return "Вы уже друзья.";
                      if (a.friends.size() >= maxFriends) return "У игрока " + a.name + " уже максимум друзей.";
                      if (b.friends.size() >= maxFriends) return "У тебя максимум друзей (" + maxFriends + ").";
                      a.friends.add(me);
                      b.friends.add(inv.from);
                      st.dirty();
                      notifyPlayer(inv.from, "§a" + p.getName() + " §rпринял твоё приглашение: вы теперь друзья!");
                      return "Теперь ты дружишь с " + a.name + "!";
                  }
                  String er = checkSpark(inv.from, me);
                  if (er != null) return er;
                  Store.Spark s = new Store.Spark();
                  if (inv.from.compareTo(me) <= 0) {
                      s.a = inv.from;
                      s.an = a.name;
                      s.b = me;
                      s.bn = b.name;
                  } else {
                      s.a = me;
                      s.an = b.name;
                      s.b = inv.from;
                      s.bn = a.name;
                  }
                  long today = today();
                  s.start = today;
                  s.lastDone = today;
                  s.streak = 0;
                  st.sparks.add(s);
                  st.event("created");
                  st.dirty();
                  notifyPlayer(inv.from, "§a" + p.getName() + " §rпринял приглашение: огонёк начат! Продли его сегодня.");
                  return "Огонёк с " + a.name + " начат! Продли его сегодня вместе с другом, и серия пойдёт.";
              }

              String declineInv(Player p, Store.Inv inv) {
                  st.invites.remove(inv);
                  st.dirty();
                  if (cooldownMin > 0) {
                      declined.put(inv.from + ">" + inv.to + ">" + inv.type, System.currentTimeMillis() + cooldownMin * 60000L);
                  }
                  notifyPlayer(inv.from, "§c" + p.getName() + " §rотклонил твоё приглашение"
                          + (inv.type.equals("spark") ? " на огонёк." : " в друзья."));
                  return "Приглашение от " + inv.fromName + " отклонено.";
              }

              String removeFriend(Player p, String fk) {
                  String me = key(p.getName());
                  Store.PD my = st.ensure(me, p.getName());
                  Store.PD f = st.players.get(fk);
                  if (!my.friends.contains(fk)) return "Этого игрока нет в твоих друзьях.";
                  my.friends.remove(fk);
                  if (f != null) f.friends.remove(me);
                  boolean lost = false;
                  Store.Spark s = spark(me, fk);
                  if (s != null) {
                      st.sparks.remove(s);
                      st.event("died");
                      lost = true;
                  }
                  Iterator<Store.Inv> it = st.invites.iterator();
                  while (it.hasNext()) {
                      Store.Inv i = it.next();
                      if ((i.from.equals(me) && i.to.equals(fk)) || (i.from.equals(fk) && i.to.equals(me))) it.remove();
                  }
                  final String fme = me;
                  final String ffk = fk;
                  st.msgs.removeIf(x -> (x.from.equals(fme) && x.to.equals(ffk)) || (x.from.equals(ffk) && x.to.equals(fme)));
                  st.dirty();
                  notifyPlayer(fk, "§c" + p.getName() + " §rудалил тебя из друзей." + (lost ? " Общий огонёк потерян." : ""));
                  String nm = f != null ? f.name : fk;
                  return nm + " удалён из друзей." + (lost ? " Общий огонёк сгорел, накопленные монеты остались у тебя." : "");
              }

              // ================== логика огоньков ==================

              String prolong(Player p, Store.Spark s) {
                  long today = today();
                  String me = key(p.getName());
                  String o = s.other(me);
                  String on = s.otherName(me);
                  if (s.last(me) == today) return "Ты уже продлил огонёк с " + on + " сегодня.";
                  s.setLast(me, today);
                  st.dirty();
                  if (s.last(o) == today) {
                      s.streak++;
                      s.lastDone = today;
                      long r = reward(s.streak);
                      Store.PD x = st.ensure(me, p.getName());
                      Store.PD y = st.ensure(o, on);
                      x.pending += r;
                      y.pending += r;
                      st.dirty();
                      notifyPlayer(o, "§aОгонёк с " + p.getName() + ": день " + s.streak + "! §r+" + fmt(r)
                              + " монет в накопитель.");
                      return "Огонёк с " + on + ": день " + s.streak + "! Каждому по " + fmt(r)
                              + " монет в накопитель. Забрать: Огоньки → Вывести монеты.";
                  }
                  notifyPlayer(o, "§e" + p.getName() + " §rпродлил огонёк. Продли и ты, чтобы не потерять серию!");
                  return "Ты продлил огонёк с " + on + ". Ждём, когда продлит и друг.";
              }

              String withdraw(Player p) {
                  String me = key(p.getName());
                  Store.PD d = st.ensure(me, p.getName());
                  if (d.pending <= 0) return "В накопителе пока нет монет.";
                  long want = d.pending;
                  long paid = econ.pay(p, want);
                  if (paid < 0) {
                      getLogger().warning("Не удалось выдать монеты игроку " + p.getName() + " (TpCoins недоступен).");
                      return "Сейчас монеты выдать не получается. Они сохранены в накопителе, попробуй чуть позже.";
                  }
                  if (paid == 0) return "Твой баланс монет заполнен. Потрать монеты и забери награду снова.";
                  d.pending = Math.max(0, d.pending - paid);
                  st.dirty();
                  if (d.pending > 0) {
                      return "Выведено " + fmt(paid) + " монет. Остаток в накопителе: " + fmt(d.pending)
                              + " (баланс почти полон).";
                  }
                  return "Выведено " + fmt(paid) + " монет на твой баланс!";
              }

              void remind(Player p) {
                  String k = key(p.getName());
                  Store.PD d = st.players.get(k);
                  if (d == null) return;
                  if (!d.notices.isEmpty()) {
                      for (String n : d.notices) p.sendMessage(PFX + n);
                      d.notices.clear();
                      st.dirty();
                  }
                  int inv = incoming(k).size();
                  if (inv > 0) p.sendMessage(PFX + "У тебя новых приглашений: §a" + inv + "§r. Открой §a/friend§r.");
                  long today = today();
                  List<String> need = new ArrayList<>();
                  for (Store.Spark s : sparksOf(k)) {
                      if (s.last(k) != today) need.add(s.otherName(k));
                  }
                  if (!need.isEmpty()) {
                      p.sendMessage(PFX + "Не забудь продлить огоньки: §e" + String.join(", ", need) + "§r. §a/friend");
                  }
                  int gc = st.giftsFor(k).size();
                  if (gc > 0) p.sendMessage(PFX + "Тебя ждут подарки: §a" + gc + "§r. §a/friend §r→ «Подарки».");
                  int um = unread(k);
                  if (um > 0) p.sendMessage(PFX + "Новых анонимных сообщений: §a" + um + "§r. §a/friend §r→ «Анонимные сообщения».");
                  if (d.pending > 0) {
                      p.sendMessage(PFX + "В накопителе огоньков: §a" + fmt(d.pending) + "§r монет.");
                  }
              }

              /** Раз в минуту: учёт времени игры, сгорание огоньков, напоминания, очистка старых приглашений. */
              void tick() {
                  try {
                      long today = today();
                      long now = System.currentTimeMillis();
                      for (Player p : getServer().getOnlinePlayers().values()) {
                          Store.PD d = st.players.get(key(p.getName()));
                          if (d != null) d.playSec += 60;
                      }
                      st.dirty();

                      long life = inviteDays * 86400000L;
                      Iterator<Store.Inv> ii = st.invites.iterator();
                      while (ii.hasNext()) {
                          if (now - ii.next().created > life) ii.remove();
                      }
                      declined.values().removeIf(v -> v < now);
                      st.pruneEvents(now - 30L * 86400000L);

                      long giftLife = giftReturnDays * 86400000L;
                      for (Store.Gift g : st.gifts) {
                          if (!g.returned && !g.from.isEmpty() && now - g.created > giftLife) {
                              String oldTo = g.toName;
                              g.returned = true;
                              g.to = g.from;
                              g.toName = g.fromName;
                              g.from = "";
                              g.fromName = "Возврат";
                              g.anon = false;
                              g.created = now;
                              notifyPlayer(g.to, "§eПодарок для " + oldTo + " не забрали за " + giftReturnDays
                                      + " дн., он вернулся к тебе. §rОткрой §a/friend §r→ «Подарки» → «Мои подарки».");
                              st.dirty();
                          }
                      }
                      long msgLife = msgKeepDays * 86400000L;
                      if (st.msgs.removeIf(x -> now - x.created > msgLife && !(x.reported && !x.handled))) st.dirty();

                      Iterator<Store.Spark> si = st.sparks.iterator();
                      while (si.hasNext()) {
                          Store.Spark s = si.next();
                          if (today - s.lastDone >= 2) {
                              si.remove();
                              st.event("died");
                              warned.remove(s.id());
                              notifyPlayer(s.a, "§cОгонёк с " + s.bn + " сгорел: серия в " + s.streak + " дн. потеряна.");
                              notifyPlayer(s.b, "§cОгонёк с " + s.an + " сгорел: серия в " + s.streak + " дн. потеряна.");
                          }
                      }

                      if (warnHours > 0) {
                          long midnight = LocalDate.now(zone).plusDays(1).atStartOfDay(zone).toInstant().toEpochMilli();
                          long rem = midnight - now;
                          for (Store.Spark s : st.sparks) {
                              if (s.lastDone == today - 1 && rem <= warnHours * 3600000L) {
                                  Long w = warned.get(s.id());
                                  if (w != null && w == today) continue;
                                  warned.put(s.id(), today);
                                  for (String k : new String[]{s.a, s.b}) {
                                      if (s.last(k) != today) {
                                          Player q = online(k);
                                          if (q != null) {
                                              q.sendMessage(PFX + "§cОгонёк с " + s.otherName(k)
                                                      + " скоро сгорит! Продли его сегодня (осталось около " + (rem / 3600000L + 1)
                                                      + " ч.).");
                                          }
                                      }
                                  }
                              }
                          }
                      }

                      if (today != lastDay) {
                          lastDay = today;
                          for (Player p : getServer().getOnlinePlayers().values()) remind(p);
                      }
                  } catch (Throwable ignored) {
                  }
              }

              // ================== события ==================

              @EventHandler
              public void onJoin(PlayerJoinEvent e) {
                  try {
                      final Player p = e.getPlayer();
                      String k = key(p.getName());
                      Store.PD d = st.ensure(k, p.getName());
                      try {
                          String ip = p.getAddress();
                          if (ip != null && !ip.isEmpty()) d.ip = ip;
                      } catch (Throwable ignored) {
                      }
                      d.lastSeen = System.currentTimeMillis();
                      st.dirty();
                      later(100, () -> {
                          if (p.isOnline()) remind(p);
                      });
                  } catch (Throwable ignored) {
                  }
              }

              @EventHandler
              public void onQuit(PlayerQuitEvent e) {
                  try {
                      Player p = e.getPlayer();
                      ctx.remove(p.getUniqueId());
                      Store.PD d = st.players.get(key(p.getName()));
                      if (d != null) {
                          d.lastSeen = System.currentTimeMillis();
                          st.dirty();
                      }
                  } catch (Throwable ignored) {
                  }
              }

              @EventHandler
              public void onForm(PlayerFormRespondedEvent e) {
                  Player p = e.getPlayer();
                  Ctx c = ctx.get(p.getUniqueId());
                  if (c == null || c.id != e.getFormID()) return;
                  ctx.remove(p.getUniqueId());
                  if (e.wasClosed() || e.getResponse() == null) return;
                  try {
                      handle(p, c, e.getResponse());
                  } catch (Throwable t) {
                      getLogger().warning("Ошибка формы: " + t);
                  }
              }

              // ================== формы ==================

              static ElementButton btn(String text) {
                  return new ElementButton("§l" + text);
              }

              void open(Player p, String type, FormWindow w, List<String> data, String extra) {
                  later(2, () -> {
                      if (!p.isOnline()) return;
                      try {
                          int id = p.showFormWindow(w);
                          ctx.put(p.getUniqueId(), new Ctx(id, type, data, extra));
                      } catch (Throwable ignored) {
                      }
                  });
              }

              /** Окно с текстом и кнопкой «Назад» (текст дублируется в чат). */
              void res(Player p, String title, String text, String back) {
                  p.sendMessage(PFX + text);
