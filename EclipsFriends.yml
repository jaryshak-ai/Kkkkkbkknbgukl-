          import java.lang.reflect.Method;
          import java.lang.reflect.Modifier;
          import java.nio.ByteOrder;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Base64;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;
          import java.util.UUID;
          import java.util.concurrent.ConcurrentHashMap;

          /**
           * Виртуальные сундуки для подарков (по образцу TopShop: фейковый сундук пакетами).
           * KIND_SEND: игрок кладёт предметы в слоты 0..N-1, нижний ряд: анонимность / отправить / отмена.
           * KIND_MINE: список полученных подарков, клик по подарку забирает его.
           */
          final class GiftUi implements Listener {

              static final int KIND_SEND = 0;
              static final int KIND_MINE = 1;
              static final int S_TOGGLE = 20;
              static final int S_SEND = 22;
              static final int S_CANCEL = 24;
              static final int S_BACK = 22;
              static final int S_ALL = 24;
              static final int MAX_SHOWN = 20;

              static final class Holder extends Vector3 implements InventoryHolder {
                  Inventory inv;

                  Holder(int x, int y, int z) {
                      super(x, y, z);
                  }

                  @Override
                  public Inventory getInventory() {
                      return inv;
                  }
              }

              static final class Menu extends ContainerInventory {
                  Menu(Holder holder) {
                      super(holder, InventoryType.CHEST);
                      holder.inv = this;
                  }
              }

              static final class Session {
                  final Player player;
                  final Level level;
                  final int x;
                  final int y;
                  final int z;
                  final int kind;
                  final String title;
                  final long created = System.currentTimeMillis();
                  Menu inv;
                  boolean open;
                  long last;
                  String friend = "";
                  String friendName = "";
                  boolean anon;
                  Map<Integer, String> actions = new HashMap<>();

                  Session(Player player, Level level, int x, int y, int z, int kind, String title) {
                      this.player = player;
                      this.level = level;
                      this.x = x;
                      this.y = y;
                      this.z = z;
                      this.kind = kind;
                      this.title = title;
                  }
              }

              private final FriendsPlugin pl;
              private final Map<UUID, Session> sessions = new ConcurrentHashMap<>();
              private final Set<Integer> banned = new HashSet<>();
              int slots = 9;

              GiftUi(FriendsPlugin pl) {
                  this.pl = pl;
              }

              void reload() {
                  slots = Math.max(1, Math.min(9, pl.getConfig().getInt("gifts.max-slots", 9)));
                  banned.clear();
                  List<String> names;
                  try {
                      names = pl.getConfig().getStringList("gifts.banned-items");
                  } catch (Throwable t) {
                      names = new ArrayList<>();
                  }
                  if (names != null) {
                      for (String n : names) {
                          Item it = safeItem(n);
                          if (it != null) banned.add(it.getId());
                      }
                  }
              }

              boolean isBanned(Item it) {
                  return it != null && !it.isNull() && banned.contains(it.getId());
              }

              // ---------------------------------------------------------------- сериализация предметов

              private static Object invokeStatic(Class<?> c, String name, Object... args) throws Exception {
                  Exception last = null;
                  for (Method m : c.getMethods()) {
                      if (!m.getName().equals(name) || m.getParameterCount() != args.length
                              || !Modifier.isStatic(m.getModifiers())) {
                          continue;
                      }
                      try {
                          return m.invoke(null, args);
                      } catch (Exception e) {
                          last = e;
                      }
                  }
                  throw last != null ? last : new NoSuchMethodException(name);
              }

              /** Предмет в строку для хранения на диске. null, если упаковать не удалось. */
              static String ser(Item it) {
                  try {
                      Object tag = invokeStatic(NBTIO.class, "putItemHelper", it);
                      byte[] b = NBTIO.write((CompoundTag) tag, ByteOrder.LITTLE_ENDIAN, true);
                      return "N:" + Base64.getEncoder().encodeToString(b);
                  } catch (Throwable ignored) {
                  }
                  try {
                      byte[] nbt = it.getCompoundTag();
                      String n = nbt == null ? "" : Base64.getEncoder().encodeToString(nbt);
                      return "L:" + it.getId() + ":" + it.getDamage() + ":" + it.getCount() + ":" + n;
                  } catch (Throwable ignored) {
                  }
                  return null;
              }

              /** Строка обратно в предмет. null, если не получилось. */
              static Item de(String s) {
                  try {
                      if (s.startsWith("N:")) {
                          byte[] b = Base64.getDecoder().decode(s.substring(2));
                          Object tag = invokeStatic(NBTIO.class, "read", b, ByteOrder.LITTLE_ENDIAN, true);
                          Object it = invokeStatic(NBTIO.class, "getItemHelper", tag);
                          return (Item) it;
                      }
                      if (s.startsWith("L:")) {
                          String[] p = s.split(":", 5);
                          int id = Integer.parseInt(p[1]);
                          int dmg = Integer.parseInt(p[2]);
                          int cnt = Integer.parseInt(p[3]);
                          Item it = (Item) invokeStatic(Item.class, "get", id, dmg, cnt);
                          if (p.length > 4 && !p[4].isEmpty()) it.setCompoundTag(Base64.getDecoder().decode(p[4]));
                          return it;
                      }
                  } catch (Throwable ignored) {
                  }
                  return null;
              }

              private static Item safeItem(String id) {
                  try {
                      Item it = Item.fromString(id);
                      return it == null || it.getId() == 0 ? null : it;
                  } catch (Exception e) {
                      return null;
                  }
              }

              private static Item mk(String... ids) {
                  for (String id : ids) {
                      Item it = safeItem(id);
                      if (it != null) return it;
                  }
                  return Item.get(Item.PAPER);
              }

              // ---------------------------------------------------------------- открытие

              void openSend(Player p, String friendKey, String friendName) {
                  Session s = prepare(p, KIND_SEND, "§lПодарок: " + friendName);
                  if (s == null) return;
                  s.friend = friendKey;
                  s.friendName = friendName;
                  s.anon = pl.giftDefaultAnon;
                  start(s);
              }

              void openMine(Player p) {
                  Session s = prepare(p, KIND_MINE, "§lМои подарки");
                  if (s == null) return;
                  start(s);
              }

              private Session prepare(Player p, int kind, String title) {
                  if (!p.isOnline()) return null;
                  Session old = sessions.get(p.getUniqueId());
                  if (old != null) end(old);
                  Level lv = p.getLevel();
                  int x = p.getFloorX();
                  int z = p.getFloorZ();
                  int y = p.getFloorY() + 3;
                  if (y > 250) y = Math.max(1, p.getFloorY() - 3);
                  return new Session(p, lv, x, y, z, kind, title);
              }

              private void start(final Session s) {
                  Player p = s.player;
                  sessions.put(p.getUniqueId(), s);
                  try {
                      sendFake(p, s.level, s.x, s.y, s.z, s.title);
                  } catch (Exception e) {
                      sessions.remove(p.getUniqueId(), s);
                      pl.getLogger().warning("Не удалось подготовить сундук подарков: " + e);
                      return;
                  }
                  pl.later(10, () -> finishOpen(s));
              }

              private void finishOpen(Session s) {
                  Player p = s.player;
                  if (sessions.get(p.getUniqueId()) != s) return;
                  if (!p.isOnline() || p.getLevel() != s.level) {
                      cleanup(s);
                      return;
                  }
                  try {
                      Menu m = new Menu(new Holder(s.x, s.y, s.z));
                      s.inv = m;
                      render(s);
                      int wid = p.addWindow(m);
                      if (wid < 0) {
                          cleanup(s);
                          return;
                      }
                      s.open = true;
                  } catch (Exception e) {
                      pl.getLogger().warning("Не удалось открыть сундук подарков: " + e);
                      cleanup(s);
                  }
              }

              private void sendFake(Player p, Level lv, int x, int y, int z, String title) throws Exception {
                  Block b = Block.get(Block.CHEST, 2);
                  b.x = x;
                  b.y = y;
                  b.z = z;
                  b.level = lv;
                  lv.sendBlocks(new Player[]{p}, new Vector3[]{b});

                  CompoundTag tag = new CompoundTag()
                          .putString("id", "Chest")
                          .putInt("x", x)
                          .putInt("y", y)
                          .putInt("z", z)
                          .putString("CustomName", title);
                  BlockEntityDataPacket pk = new BlockEntityDataPacket();
                  pk.x = x;
                  pk.y = y;
                  pk.z = z;
                  pk.namedTag = NBTIO.write(tag, ByteOrder.LITTLE_ENDIAN, true);
                  p.dataPacket(pk);
              }

              private void restoreBlock(Session s) {
                  try {
                      if (s.player.isOnline() && s.player.getLevel() == s.level) {
                          s.level.sendBlocks(new Player[]{s.player}, new Vector3[]{new Vector3(s.x, s.y, s.z)});
                      }
                  } catch (Exception ignored) {
                  }
              }

              private void cleanup(Session s) {
                  if (!sessions.remove(s.player.getUniqueId(), s)) return;
                  s.open = false;
                  restoreBlock(s);
              }

              private void closeChest(Session s) {
                  try {
                      if (s.inv != null && s.player.isOnline()) s.player.removeWindow(s.inv);
                  } catch (Exception ignored) {
                  }
                  cleanup(s);
              }

              /** Вернуть игроку то, что он положил в сундук, и закрыть сундук. */
              private void end(Session s) {
                  returnItems(s);
                  closeChest(s);
              }

              private void give(Player p, Item it) {
                  try {
                      Item[] left = p.getInventory().addItem(it);
                      if (left != null) {
                          for (Item l : left) {
                              if (l != null && !l.isNull()) p.getLevel().dropItem(p, l);
                          }
                      }
                  } catch (Throwable ignored) {
                  }
              }

              private void returnItems(Session s) {
                  if (s.kind != KIND_SEND || s.inv == null) return;
                  for (int i = 0; i < slots; i++) {
                      try {
                          Item it = s.inv.getItem(i);
                          if (it == null || it.isNull()) continue;
                          s.inv.setItem(i, Item.get(0));
                          give(s.player, it);
                      } catch (Throwable ignored) {
                      }
                  }
              }

              void closeAll() {
                  for (Session s : new ArrayList<>(sessions.values())) {
                      try {
                          returnItems(s);
                          cleanup(s);
                      } catch (Throwable ignored) {
                      }
                  }
              }

              /** Раз в секунду: если окно закрылось без события (смерть, телепорт), возвращаем вещи. */
              void sweep() {
                  for (Session s : new ArrayList<>(sessions.values())) {
                      try {
                          if (!s.open || s.inv == null) continue;
                          if (!s.player.isOnline()) {
                              returnItems(s);
                              cleanup(s);
                          } else if (s.player.getWindowId(s.inv) < 0) {
                              returnItems(s);
                              cleanup(s);
                          }
                      } catch (Throwable ignored) {
                      }
                  }
              }

              // ---------------------------------------------------------------- события

              @EventHandler
              public void onClose(InventoryCloseEvent e) {
                  Session s = sessions.get(e.getPlayer().getUniqueId());
                  if (s != null && s.inv != null && s.inv == e.getInventory()) {
                      returnItems(s);
                      cleanup(s);
                  }
              }

              @EventHandler
              public void onQuit(PlayerQuitEvent e) {
                  Session s = sessions.remove(e.getPlayer().getUniqueId());
                  if (s != null) {
                      try {
                          returnItems(s);
                      } catch (Throwable ignored) {
                      }
                  }
              }

              @EventHandler(priority = EventPriority.HIGHEST)
              public void onTransaction(InventoryTransactionEvent e) {
                  Player p = e.getTransaction().getSource();
                  final Session s = sessions.get(p.getUniqueId());
                  if (s == null || s.inv == null) return;
                  boolean ours = false;
                  boolean bad = false;
                  boolean banHit = false;
                  int slot = -1;
                  for (InventoryAction a : e.getTransaction().getActions()) {
                      if (a instanceof SlotChangeAction) {
                          SlotChangeAction sa = (SlotChangeAction) a;
                          if (sa.getInventory() == s.inv) {
                              ours = true;
                              int sl = sa.getSlot();
                              if (s.kind == KIND_SEND && sl >= 0 && sl < slots) {
                                  if (isBanned(sa.getTargetItem())) {
                                      bad = true;
                                      banHit = true;
                                  }
                              } else {
                                  bad = true;
                                  if (slot < 0) slot = sl;
                              }
                          }
                      }
                  }
                  if (!ours) return;
                  if (!bad) return; // свободные слоты подарка: перекладывать можно
                  e.setCancelled(true);
                  if (banHit) {
                      p.sendMessage(FriendsPlugin.PFX + "§cЭтот предмет нельзя дарить.");
                  }
                  final int clicked = slot;
                  pl.later(1, () -> {
                      handleClick(s, clicked);
                      resync(s);
                  });
              }

              private void resync(Session s) {
                  try {
                      if (sessions.get(s.player.getUniqueId()) == s && s.inv != null && s.player.isOnline()) {
                          s.inv.sendContents(s.player);
                          s.player.getInventory().sendContents(s.player);
                      }
                  } catch (Exception ignored) {
                  }
              }

              // ---------------------------------------------------------------- отрисовка

              private Item filler() {
                  Item it = mk("gray_stained_glass_pane", "stained_glass_pane", "glass_pane", "iron_bars");
                  it.setCustomName("§r ");
                  return it;
              }

              private Item toggleItem(Session s) {
                  Item it = mk("name_tag", "paper");
                  it.setCustomName("§l§eАнонимно: " + (s.anon ? "§aДА" : "§cНЕТ"));
                  it.setLore(new String[]{
                          "§7Нажми, чтобы переключить",
                          "§7Получатель увидит: §f" + (s.anon ? "Аноним" : s.player.getName())});
                  return it;
              }

              private void render(Session s) {
                  if (s.inv == null) return;
                  try {
                      if (s.kind == KIND_SEND) renderSend(s);
                      else renderMine(s);
                  } catch (Exception e) {
                      pl.getLogger().warning("Ошибка отрисовки сундука подарков: " + e);
                  }
              }

              private void renderSend(Session s) {
                  Item f = filler();
                  for (int i = slots; i < 27; i++) {
                      if (i == S_TOGGLE || i == S_SEND || i == S_CANCEL) continue;
                      s.inv.setItem(i, f.clone());
                  }
                  s.inv.setItem(S_TOGGLE, toggleItem(s));
                  Item send = mk("emerald", "gold_ingot");
                  send.setCustomName("§l§aОтправить подарок");
                  send.setLore(new String[]{"§7Кому: §f" + s.friendName,
                          "§7Положи предметы в верхние слоты (до " + slots + ")"});
                  s.inv.setItem(S_SEND, send);
                  Item cancel = mk("barrier", "arrow");
                  cancel.setCustomName("§l§cОтмена");
                  cancel.setLore(new String[]{"§7Предметы вернутся тебе"});
                  s.inv.setItem(S_CANCEL, cancel);
                  Map<Integer, String> act = new HashMap<>();
                  act.put(S_TOGGLE, "toggle");
                  act.put(S_SEND, "send");
                  act.put(S_CANCEL, "cancel");
                  s.actions = act;
              }

              private void renderMine(Session s) {
                  Map<Integer, Item> m = new HashMap<>();
                  Map<Integer, String> act = new HashMap<>();
                  String me = FriendsPlugin.key(s.player.getName());
                  List<Store.Gift> list = pl.st.giftsFor(me);
                  for (int i = 0; i < list.size() && i < MAX_SHOWN; i++) {
                      Store.Gift g = list.get(i);
                      m.put(i, icon(g));
                      act.put(i, "g:" + g.id);
                  }
                  Item f = filler();
                  for (int i = 0; i < 27; i++) {
                      if (!m.containsKey(i) && i != S_BACK && i != S_ALL) m.put(i, f.clone());
                  }
                  Item back = mk("barrier", "arrow");
                  back.setCustomName("§l§cНазад");
                  m.put(S_BACK, back);
                  act.put(S_BACK, "back");
                  Item all = mk("chest", "paper");
                  all.setCustomName("§l§aЗабрать всё");
                  all.setLore(new String[]{"§7Подарков: §f" + list.size()});
                  m.put(S_ALL, all);
                  act.put(S_ALL, "all");
                  s.actions = act;
                  s.inv.setContents(m);
              }

              private Item icon(Store.Gift g) {
                  Item first = null;
                  List<String> names = new ArrayList<>();
                  for (String z : g.items) {
                      Item it = de(z);
                      if (it == null) continue;
                      if (first == null) first = it;
                      if (names.size() < 5) names.add("§7• §f" + it.getName() + " §7x" + it.getCount());
                  }
                  Item show = first != null ? first.clone() : Item.get(Item.PAPER);
                  List<String> lore = new ArrayList<>();
                  try {
                      String[] old = show.getLore();
                      if (old != null) lore.addAll(Arrays.asList(old));
                  } catch (Throwable ignored) {
                  }
                  String from = g.from.isEmpty() ? "Возврат неполученного подарка" : (g.anon ? "Аноним" : g.fromName);
                  lore.add("§r");
                  lore.add("§6§lОт: §r§f" + from);
                  lore.add("§7Дата: " + pl.dt(g.created));
                  lore.add("§7Предметов в подарке: §f" + g.items.size());
                  lore.addAll(names);
                  lore.add("§aНажми, чтобы забрать");
                  show.setLore(lore.toArray(new String[0]));
                  return show;
              }

              // ---------------------------------------------------------------- клики

              private void handleClick(Session s, int slot) {
                  if (sessions.get(s.player.getUniqueId()) != s || !s.open || slot < 0) return;
                  String a = s.actions.get(slot);
                  if (a == null) return;
                  long now = System.currentTimeMillis();
                  if (now - s.last < 200) return;
                  s.last = now;
                  final Player p = s.player;
                  try {
                      if (s.kind == KIND_SEND) {
                          if (a.equals("toggle")) {
                              s.anon = !s.anon;
                              s.inv.setItem(S_TOGGLE, toggleItem(s));
                          } else if (a.equals("send")) {
                              trySend(s);
                          } else if (a.equals("cancel")) {
                              end(s);
                              pl.later(6, () -> pl.menuGifts(p));
                          }
                          return;
                      }
                      if (a.startsWith("g:")) {
                          long id = Long.parseLong(a.substring(2));
                          Store.Gift g = pl.st.findGift(id);
                          if (g != null && g.to.equals(FriendsPlugin.key(p.getName()))) {
                              say(p, claim(p, g));
                          }
                          render(s);
                      } else if (a.equals("all")) {
                          String me = FriendsPlugin.key(p.getName());
                          List<Store.Gift> list = pl.st.giftsFor(me);
                          if (list.isEmpty()) {
                              say(p, "Подарков нет.");
                          }
                          for (Store.Gift g : list) {
                              say(p, claim(p, g));
                          }
                          render(s);
                      } else if (a.equals("back")) {
                          closeChest(s);
                          pl.later(6, () -> pl.menuGifts(p));
                      }
                  } catch (Throwable ex) {
                      pl.getLogger().warning("Ошибка клика в сундуке подарков: " + ex);
                  }
              }

              private void say(Player p, String text) {
                  p.sendMessage(FriendsPlugin.PFX + text);
                  try {
                      p.sendTip(text);
                  } catch (Throwable ignored) {
                  }
              }

              /** Забирает подарок в инвентарь. Что не влезло, остаётся в подарке. */
              String claim(Player p, Store.Gift g) {
                  List<String> left = new ArrayList<>();
                  boolean full = false;
                  for (String z : g.items) {
                      if (full) {
                          left.add(z);
                          continue;
                      }
                      Item it = de(z);
                      if (it == null) {
                          left.add(z);
                          continue;
                      }
                      Item[] r = p.getInventory().addItem(it);
                      if (r != null && r.length > 0 && r[0] != null && !r[0].isNull()) {
                          String ls = ser(r[0]);
                          left.add(ls == null ? z : ls);
                          full = true;
                      }
                  }
                  g.items.clear();
                  g.items.addAll(left);
                  String who = g.from.isEmpty() ? "возврат" : (g.anon ? "от Анонима" : "от " + g.fromName);
                  if (left.isEmpty()) {
                      pl.st.gifts.remove(g);
                      pl.st.dirty();
                      pl.st.flush();
                      if (!g.from.isEmpty()) {
                          pl.notifyPlayer(g.from, "§a" + p.getName() + " §rзабрал твой подарок.");
                      }
                      return "Подарок (" + who + ") получен!";
                  }
                  pl.st.dirty();
                  pl.st.flush();
                  return "В инвентаре не хватило места. Остаток подарка (" + who + ") ждёт в сундуке.";
              }

              private void trySend(Session s) {
                  Player p = s.player;
                  String me = FriendsPlugin.key(p.getName());
                  Store.PD my = pl.st.ensure(me, p.getName());
                  Store.PD to = pl.st.players.get(s.friend);
                  if (to == null || !my.friends.contains(s.friend)) {
                      say(p, "Вы больше не друзья, подарок отменён.");
                      end(s);
                      pl.later(6, () -> pl.menuGifts(p));
                      return;
                  }
                  if (pl.st.giftsFor(s.friend).size() >= pl.giftMaxUnclaimed) {
                      say(p, to.name + " не может принять ещё подарки: у него слишком много неполученных.");
                      return;
                  }
                  List<String> packed = new ArrayList<>();
                  List<Integer> used = new ArrayList<>();
                  for (int i = 0; i < slots; i++) {
                      Item it = s.inv.getItem(i);
                      if (it == null || it.isNull()) continue;
                      if (isBanned(it)) {
                          say(p, "Предмет «" + it.getName() + "» нельзя дарить. Убери его из сундука.");
                          return;
                      }
                      String z = ser(it);
                      if (z == null) {
                          say(p, "Не удалось упаковать «" + it.getName() + "». Убери его из сундука.");
                          return;
                      }
                      packed.add(z);
                      used.add(i);
                  }
                  if (packed.isEmpty()) {
                      say(p, "Положи в сундук хотя бы один предмет.");
                      return;
                  }
                  Store.Gift g = new Store.Gift();
                  g.id = pl.st.newId();
                  g.from = me;
                  g.fromName = p.getName();
                  g.to = s.friend;
                  g.toName = to.name;
                  g.anon = s.anon;
                  g.created = System.currentTimeMillis();
                  g.items.addAll(packed);
                  pl.st.gifts.add(g);
                  pl.st.event("gift");
                  for (int i : used) s.inv.setItem(i, Item.get(0));
                  pl.st.dirty();
                  pl.st.flush();
                  pl.getLogger().info("[ПОДАРОК] " + p.getName() + " -> " + to.name + (g.anon ? " (анонимно)" : "")
                          + ", предметов: " + packed.size());
                  pl.notifyPlayer(s.friend, g.anon
                          ? "§aТебе пришёл анонимный подарок! §rОткрой §a/friend §r→ «Подарки» → «Мои подарки»."
                          : "§aТебе подарок от " + p.getName() + "! §rОткрой §a/friend §r→ «Подарки» → «Мои подарки».");
                  final String done = "Подарок отправлен игроку " + to.name + (g.anon ? " анонимно." : ".");
                  closeChest(s);
                  pl.later(6, () -> pl.res(p, "Подарок", done, "gifts"));
              }
          }
