          package ru.eclips.friends;

          import cn.nukkit.Player;
          import cn.nukkit.event.EventHandler;
          import cn.nukkit.event.Listener;
          import cn.nukkit.event.player.PlayerQuitEvent;
          import cn.nukkit.level.Level;
          import cn.nukkit.math.Vector3;
          import cn.nukkit.plugin.Plugin;

          import java.lang.reflect.Method;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.Iterator;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;
          import java.util.UUID;

          /**
           * Подсветка невидимых друзей: зелёные частицы и зелёный ник над головой,
           * которые видят только друзья невидимого игрока. Всё отправляется пакетами конкретным зрителям.
           * Частицы и плавающий текст создаются через рефлексию: если API ядра не совпадёт,
           * соответствующая часть тихо отключится, остальное продолжит работать.
           */
          final class Glow implements Listener {

              static final String HIDE_PERM = "eclipsfriends.invis.hide";
              private static final int EFFECT_INVISIBILITY = 14;
              private static final int PARTICLE_HAPPY_VILLAGER = 20;

              static final class Hl {
                  UUID target;
                  Player viewer;
                  Level level;
                  Object text;
                  double x;
                  double y;
                  double z;
              }

              private final FriendsPlugin pl;
              private final Map<String, Hl> map = new HashMap<>();
              private final List<Object[]> ext = new ArrayList<>();
              private final Set<String> disabledWorlds = new HashSet<>();
              boolean enabled = true;
              boolean particles = true;
              boolean nameTag = true;
              int interval = 5;
              private double radius2 = 32 * 32;
              private String color = "§a";
              private boolean particleBroken = false;
              private boolean textBroken = false;
              private int phase = 0;

              Glow(FriendsPlugin pl) {
                  this.pl = pl;
              }

              void reload() {
                  enabled = pl.getConfig().getBoolean("invisibility.enabled", true);
                  particles = pl.getConfig().getBoolean("invisibility.particles", true);
                  nameTag = pl.getConfig().getBoolean("invisibility.name-tag", true);
                  interval = Math.max(2, pl.getConfig().getInt("invisibility.interval-ticks", 5));
                  int r = Math.max(4, pl.getConfig().getInt("invisibility.radius", 32));
                  radius2 = (double) r * r;
                  color = pl.getConfig().getString("invisibility.name-color", "§a");
                  disabledWorlds.clear();
                  try {
                      List<String> l = pl.getConfig().getStringList("invisibility.disabled-worlds");
                      if (l != null) {
                          for (String w : l) disabledWorlds.add(w.trim().toLowerCase());
                      }
                  } catch (Throwable ignored) {
                  }
              }

              // ---------------------------------------------------------------- рефлексия

              private void send(Level lv, Object particle, Player viewer) throws Exception {
                  for (Method m : lv.getClass().getMethods()) {
                      if (!m.getName().equals("addParticle") || m.getParameterCount() != 2) continue;
                      Class<?>[] t = m.getParameterTypes();
                      if (t[1] == Player[].class && t[0].isInstance(particle)) {
                          m.invoke(lv, particle, new Player[]{viewer});
                          return;
                      }
                  }
                  throw new NoSuchMethodException("Level.addParticle(Particle, Player[])");
              }

              private Object newGeneric(double x, double y, double z) throws Exception {
                  Class<?> c = Class.forName("cn.nukkit.level.particle.GenericParticle");
                  return c.getConstructor(Vector3.class, int.class).newInstance(new Vector3(x, y, z), PARTICLE_HAPPY_VILLAGER);
              }

              private Object newText(double x, double y, double z, String title) throws Exception {
                  Class<?> c = Class.forName("cn.nukkit.level.particle.FloatingTextParticle");
                  try {
                      return c.getConstructor(Vector3.class, String.class).newInstance(new Vector3(x, y, z), title);
                  } catch (NoSuchMethodException e) {
                      return c.getConstructor(Vector3.class, String.class, String.class)
                              .newInstance(new Vector3(x, y, z), title, "");
                  }
              }

              private void hideText(Object text) {
                  try {
                      Method m = text.getClass().getMethod("setInvisible", boolean.class);
                      m.invoke(text, true);
                  } catch (Throwable e) {
                      try {
                          text.getClass().getMethod("setInvisible").invoke(text);
                      } catch (Throwable ignored) {
                      }
                  }
              }

              /** Убирает у зрителя плавающий ник. */
              private void clear(Hl h) {
                  if (h.text == null) return;
                  try {
                      if (h.viewer != null && h.viewer.isOnline() && h.level != null) {
                          hideText(h.text);
                          send(h.level, h.text, h.viewer);
                      }
                  } catch (Throwable ignored) {
                  }
                  h.text = null;
              }

              // ---------------------------------------------------------------- исключения

              /** Ищет в Duel и StaffCmds методы вида isInDuel(Player) / isSp(Player), если они есть. */
              private void refreshExternal() {
                  ext.clear();
                  String[][] plugins = {{"Duel", "Duels", "EclipsDuel"}, {"StaffCmds"}};
                  String[][] methods = {
                          {"isInDuel", "inDuel", "isDueling", "isDuel", "isInArena"},
                          {"isSp", "isInSp", "inSp", "isSpectating", "isStaffMode", "isSpMode"}};
                  for (int i = 0; i < plugins.length; i++) {
                      for (String pn : plugins[i]) {
                          try {
                              Plugin pg = pl.getServer().getPluginManager().getPlugin(pn);
                              if (pg == null) continue;
                              for (Method m : pg.getClass().getMethods()) {
                                  if (m.getParameterCount() != 1 || m.getReturnType() != boolean.class) continue;
                                  for (String mn : methods[i]) {
                                      if (m.getName().equalsIgnoreCase(mn)) ext.add(new Object[]{pg, m});
                                  }
                              }
                          } catch (Throwable ignored) {
                          }
                      }
                  }
              }

              private boolean external(Player p) {
                  for (Object[] e : ext) {
                      try {
                          Method m = (Method) e[1];
                          Class<?> t = m.getParameterTypes()[0];
                          Object arg = t.isInstance(p) ? p : (t == String.class ? p.getName() : null);
                          if (arg == null) continue;
                          if (Boolean.TRUE.equals(m.invoke(e[0], arg))) return true;
                      } catch (Throwable ignored) {
                      }
                  }
                  return false;
              }

              private boolean worldOff(Player p) {
                  try {
                      Level l = p.getLevel();
                      return l != null && disabledWorlds.contains(l.getName().trim().toLowerCase());
                  } catch (Throwable t) {
                      return false;
                  }
              }

              /** Подсвечивать ли этого игрока: он в невидимости, не модератор в /sp и не в дуэли. */
              private boolean revealed(Player t) {
                  if (!t.isOnline() || !t.hasEffect(EFFECT_INVISIBILITY)) return false;
                  if (t.isSpectator() || t.hasPermission(HIDE_PERM)) return false;
                  if (worldOff(t) || external(t)) return false;
                  return true;
              }

              private boolean viewerOk(Player t, Player v) {
                  if (!v.isOnline() || v.isSpectator()) return false;
                  if (v.getLevel() != t.getLevel()) return false;
                  if (t.distanceSquared(v) > radius2) return false;
                  return !external(v);
              }

              // ---------------------------------------------------------------- цикл

              void tick() {
                  if (!enabled) return;
                  phase++;
                  if (phase % 40 == 1) refreshExternal();
                  Set<String> active = new HashSet<>();
                  for (Player t : pl.getServer().getOnlinePlayers().values()) {
                      try {
                          if (!revealed(t)) continue;
                          Store.PD d = pl.st.players.get(FriendsPlugin.key(t.getName()));
                          if (d == null || d.friends.isEmpty()) continue;
                          for (String fk : d.friends) {
                              Player v = pl.online(fk);
                              if (v == null || v == t) continue;
                              if (!viewerOk(t, v)) continue;
                              String id = t.getUniqueId() + ">" + v.getUniqueId();
                              active.add(id);
                              show(id, t, v);
                          }
                      } catch (Throwable ignored) {
                      }
                  }
                  Iterator<Map.Entry<String, Hl>> it = map.entrySet().iterator();
                  while (it.hasNext()) {
                      Map.Entry<String, Hl> e = it.next();
                      if (!active.contains(e.getKey())) {
                          clear(e.getValue());
                          it.remove();
                      }
                  }
              }

              private void show(String id, Player t, Player v) {
                  Level lv = t.getLevel();
                  double x = t.x;
                  double y = t.y;
                  double z = t.z;
                  if (particles && !particleBroken) {
                      try {
                          for (int i = 0; i < 6; i++) {
                              double ang = phase * 0.6 + i * Math.PI / 3.0;
                              double px = x + Math.cos(ang) * 0.7;
                              double pz = z + Math.sin(ang) * 0.7;
                              double py = y + 0.2 + (i % 3) * 0.6;
                              send(lv, newGeneric(px, py, pz), v);
                          }
                      } catch (Throwable e) {
                          particleBroken = true;
                          pl.getLogger().warning("Частицы подсветки недоступны в этом ядре, отключены: " + e);
                      }
                  }
                  if (nameTag && !textBroken) {
                      try {
                          Hl h = map.get(id);
                          if (h == null) {
                              h = new Hl();
                              h.target = t.getUniqueId();
                              h.viewer = v;
                              map.put(id, h);
                          }
                          double dx = x - h.x;
                          double dy = y - h.y;
                          double dz = z - h.z;
                          boolean moved = dx * dx + dy * dy + dz * dz > 0.12;
                          if (h.text == null || moved || h.level != lv) {
                              if (h.text != null) {
                                  hideText(h.text);
                                  send(h.level, h.text, v);
                              }
                              Object txt = newText(x, y + 2.3, z, color + t.getName());
                              send(lv, txt, v);
                              h.text = txt;
                              h.level = lv;
                              h.x = x;
                              h.y = y;
                              h.z = z;
                          }
                      } catch (Throwable e) {
                          textBroken = true;
                          pl.getLogger().warning("Ник над головой недоступен в этом ядре, остаются только частицы: " + e);
                      }
                  }
              }

              void closeAll() {
                  for (Hl h : map.values()) clear(h);
                  map.clear();
              }

              @EventHandler
              public void onQuit(PlayerQuitEvent e) {
                  try {
                      Player p = e.getPlayer();
                      UUID id = p.getUniqueId();
                      Iterator<Map.Entry<String, Hl>> it = map.entrySet().iterator();
                      while (it.hasNext()) {
                          Hl h = it.next().getValue();
                          if (h.viewer == p) {
                              it.remove();
                          } else if (id.equals(h.target)) {
                              clear(h);
                              it.remove();
                          }
                      }
                  } catch (Throwable ignored) {
                  }
              }
          }
