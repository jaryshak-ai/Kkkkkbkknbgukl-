                      return;
                  }
                  FormWindowSimple w = new FormWindowSimple("§lКому подарок?", "Выбери друга. Дальше откроется сундук: положи в него предметы.");
                  List<String> keys = new ArrayList<>();
                  for (String fk : d.friends) {
                      Store.PD f = st.players.get(fk);
                      w.addButton(btn((f != null ? f.name : fk) + (online(fk) != null ? " (в сети)" : "")));
                      keys.add(fk);
                  }
                  open(p, "giftFriend", w, keys, null);
              }

              void menuTp(Player p) {
                  String k = key(p.getName());
                  Store.PD d = st.ensure(k, p.getName());
                  FormWindowSimple w = new FormWindowSimple("§lТелепорт к другу", "Выбери друга в сети, ему придёт запрос на телепортацию.");
                  List<String> keys = new ArrayList<>();
                  for (String fk : d.friends) {
                      Player o = online(fk);
                      if (o == null) continue;
                      w.addButton(btn(o.getName()));
                      keys.add(fk);
                  }
                  if (keys.isEmpty()) {
                      res(p, "Телепорт к другу", "Сейчас никто из друзей не в сети.", "main");
                      return;
                  }
                  open(p, "tp", w, keys, null);
              }

              void menuMsgs(Player p) {
                  String k = key(p.getName());
                  Store.PD d = st.ensure(k, p.getName());
                  int um = unread(k);
                  FormWindowSimple w = new FormWindowSimple("§lАнонимные сообщения",
                          "§lОсталось отправить сегодня: §r" + msgLeft(d) + " из " + msgLimit
                                  + "\n§lНовых сообщений: §r" + um
                                  + "\nПисать можно только друзьям. Автор скрыт, на ответ приходит твой ник.");
                  w.addButton(btn("Написать анонимное сообщение"));
                  w.addButton(btn("Прочитать мои сообщения" + (um > 0 ? " (" + um + ")" : "")));
                  w.addButton(btn("Ответить на сообщение"));
                  w.addButton(btn("Назад"));
                  open(p, "msgs", w, null, null);
              }

              void menuMsgFriend(Player p) {
                  String k = key(p.getName());
                  Store.PD d = st.ensure(k, p.getName());
                  if (d.friends.isEmpty()) {
                      res(p, "Написать сообщение", "У тебя пока нет друзей.", "msgs");
                      return;
                  }
                  if (msgLeft(d) <= 0) {
                      res(p, "Написать сообщение", "Лимит на сегодня исчерпан: " + msgLimit + " сообщений. Новый день в 00:00.", "msgs");
                      return;
                  }
                  FormWindowSimple w = new FormWindowSimple("§lКому написать?", "Выбери друга. Он не узнает, что это ты.");
                  List<String> keys = new ArrayList<>();
                  for (String fk : d.friends) {
                      Store.PD f = st.players.get(fk);
                      w.addButton(btn((f != null ? f.name : fk) + (online(fk) != null ? " (в сети)" : "")));
                      keys.add(fk);
                  }
                  open(p, "msgFriend", w, keys, null);
              }

              void menuMsgInput(Player p, String fk) {
                  Store.PD d = st.ensure(key(p.getName()), p.getName());
                  Store.PD f = st.players.get(fk);
                  FormWindowCustom w = new FormWindowCustom("§lСообщение для " + (f != null ? f.name : fk));
                  w.addElement(new ElementInput("Текст (до " + msgMax + " символов). Осталось сегодня: " + msgLeft(d), "Напиши сообщение"));
                  open(p, "msgInput", w, null, fk);
              }

              void menuInbox(Player p) {
                  String k = key(p.getName());
                  List<Store.Msg> list = inbox(k);
                  if (list.isEmpty()) {
                      res(p, "Мои сообщения", "У тебя пока нет сообщений.", "msgs");
                      return;
                  }
                  FormWindowSimple w = new FormWindowSimple("§lМои сообщения", "Выбери сообщение, чтобы прочитать.");
                  List<String> ids = new ArrayList<>();
                  for (Store.Msg m : list) {
                      if (ids.size() >= 30) break;
                      String who = m.type.equals("reply") ? "Ответ от " + m.fromName : "Аноним";
                      w.addButton(btn((m.read ? "" : "[новое] ") + who + " · " + dt(m.created)));
                      ids.add(String.valueOf(m.id));
                  }
                  open(p, "inbox", w, ids, null);
              }

              void menuMsgView(Player p, long id) {
                  String k = key(p.getName());
                  Store.Msg m = st.findMsg(id);
                  if (m == null || !m.to.equals(k)) {
                      res(p, "Сообщение", "Это сообщение уже недоступно.", "inbox");
                      return;
                  }
                  m.read = true;
                  st.dirty();
                  String head = m.type.equals("reply") ? "Ответ от " + m.fromName : "Анонимное сообщение";
                  FormWindowSimple w = new FormWindowSimple("§l" + head,
                          "§l" + dt(m.created) + "§r\n\n" + m.text + (m.replied ? "\n\n§lТы уже ответил на это сообщение." : ""));
                  List<String> acts = new ArrayList<>();
                  if (m.type.equals("anon") && !m.replied) {
                      w.addButton(btn("Ответить"));
                      acts.add("reply");
                  }
                  if (!m.reported) {
                      w.addButton(btn("Пожаловаться"));
                      acts.add("report");
                      w.addButton(btn("Удалить"));
                      acts.add("delete");
                  }
                  w.addButton(btn("Назад"));
                  acts.add("back");
                  open(p, "msgView", w, acts, String.valueOf(id));
              }

              void menuReplyList(Player p) {
                  String k = key(p.getName());
                  List<Store.Msg> list = new ArrayList<>();
                  for (Store.Msg m : inbox(k)) {
                      if (m.type.equals("anon") && !m.replied) list.add(m);
                  }
                  if (list.isEmpty()) {
                      res(p, "Ответить", "Нет сообщений, на которые можно ответить.", "msgs");
                      return;
                  }
                  FormWindowSimple w = new FormWindowSimple("§lОтветить на сообщение", "Выбери сообщение. Ответ придёт автору от твоего имени.");
                  List<String> ids = new ArrayList<>();
                  for (Store.Msg m : list) {
                      if (ids.size() >= 30) break;
                      String t = m.text.length() > 28 ? m.text.substring(0, 28) + "…" : m.text;
                      w.addButton(btn(dt(m.created) + ": " + t));
                      ids.add(String.valueOf(m.id));
                  }
                  open(p, "replyList", w, ids, null);
              }

              void menuReplyInput(Player p, long id) {
                  Store.Msg m = st.findMsg(id);
                  if (m == null || !m.to.equals(key(p.getName())) || m.replied) {
                      res(p, "Ответить", "На это сообщение уже нельзя ответить.", "msgs");
                      return;
                  }
                  FormWindowCustom w = new FormWindowCustom("§lОтвет на сообщение");
                  w.addElement(new ElementInput("Твой ответ (до " + msgMax + " символов)", "Напиши ответ"));
                  open(p, "replyInput", w, null, String.valueOf(id));
              }

              // ================== обработка ответов ==================

              static String inputOf(FormResponse r) {
                  if (r instanceof FormResponseCustom) {
                      String s = ((FormResponseCustom) r).getInputResponse(0);
                      return s == null ? "" : s.trim();
                  }
                  return "";
              }

              static long parseId(String s) {
                  try {
                      return Long.parseLong(s);
                  } catch (Throwable t) {
                      return -1;
                  }
              }

              void handle(Player p, Ctx c, FormResponse r) {
                  int idx = -1;
                  if (r instanceof FormResponseSimple) idx = ((FormResponseSimple) r).getClickedButtonId();
                  else if (r instanceof FormResponseModal) idx = ((FormResponseModal) r).getClickedButtonId();
                  String k = key(p.getName());
                  boolean inData = c.data != null && idx >= 0 && idx < c.data.size();
                  switch (c.type) {
                      case "main":
                          if (idx == 0) menuSpark(p);
                          else if (idx == 1) menuGifts(p);
                          else if (idx == 2) menuTp(p);
                          else if (idx == 3) menuMsgs(p);
                          else if (idx == 4) menuAdd(p);
                          else if (idx == 5) menuInvites(p);
                          else if (idx == 6) menuOnline(p);
                          else if (idx == 7) menuDelete(p);
                          break;
                      case "spark":
                          if (idx == 0) menuStart(p);
                          else if (idx == 1) menuMySparks(p);
                          else if (idx == 2) menuProlong(p);
                          else if (idx == 3) res(p, "Вывод монет", withdraw(p), "spark");
                          else if (idx == 4) menuWhat(p);
                          else if (idx == 5) menuMain(p);
                          break;
                      case "start":
                          if (inData) res(p, "Начать огонёк", inviteSpark(p, c.data.get(idx)), "spark");
                          break;
                      case "prolong":
                          if (inData) {
                              String id = c.data.get(idx);
                              Store.Spark target = null;
                              for (Store.Spark s : st.sparks) {
                                  if (s.id().equals(id)) target = s;
                              }
                              if (target == null || !(target.a.equals(k) || target.b.equals(k))) {
                                  res(p, "Продлить огонёк", "Этот огонёк уже недействителен.", "spark");
                              } else {
                                  res(p, "Продлить огонёк", prolong(p, target), "spark");
                              }
                          }
                          break;
                      case "gifts":
                          if (idx == 0) menuGiftFriend(p);
                          else if (idx == 1) gifts.openMine(p);
                          else if (idx == 2) menuMain(p);
                          break;
                      case "giftFriend":
                          if (inData) {
                              String fk = c.data.get(idx);
                              Store.PD f = st.players.get(fk);
                              Store.PD me = st.ensure(k, p.getName());
                              if (f == null || !me.friends.contains(fk)) {
                                  res(p, "Сделать подарок", "Этот игрок больше не в твоих друзьях.", "gifts");
                              } else if (st.giftsFor(fk).size() >= giftMaxUnclaimed) {
                                  res(p, "Сделать подарок", f.name + " не может принять ещё подарки: у него слишком много неполученных.", "gifts");
                              } else {
                                  gifts.openSend(p, fk, f.name);
                              }
                          }
                          break;
                      case "tp":
                          if (inData) {
                              String fk = c.data.get(idx);
                              Player t = online(fk);
                              if (t == null) {
                                  res(p, "Телепорт к другу", "Игрок уже вышел из игры.", "main");
                              } else {
                                  p.sendMessage(PFX + "Отправляю запрос на телепортацию игроку §e" + t.getName() + "§r.");
                                  try {
                                      getServer().dispatchCommand(p, "tpa " + fk);
                                  } catch (Throwable ignored) {
                                  }
                              }
                          }
                          break;
                      case "msgs":
                          if (idx == 0) menuMsgFriend(p);
                          else if (idx == 1) menuInbox(p);
                          else if (idx == 2) menuReplyList(p);
                          else if (idx == 3) menuMain(p);
                          break;
                      case "msgFriend":
                          if (inData) menuMsgInput(p, c.data.get(idx));
                          break;
                      case "msgInput": {
                          String in = inputOf(r);
                          if (in.isEmpty()) res(p, "Написать сообщение", "Ты не ввёл текст.", "msgs");
                          else res(p, "Написать сообщение", sendAnon(p, c.extra == null ? "" : c.extra, in), "msgs");
                          break;
                      }
                      case "inbox":
                          if (inData) menuMsgView(p, parseId(c.data.get(idx)));
                          break;
                      case "msgView": {
                          long id = parseId(c.extra);
                          Store.Msg m = st.findMsg(id);
                          if (!inData || m == null || !m.to.equals(k)) {
                              menuInbox(p);
                              break;
                          }
                          String act = c.data.get(idx);
                          if (act.equals("reply")) menuReplyInput(p, id);
                          else if (act.equals("report")) res(p, "Жалоба", reportMsg(p, m), "inbox");
                          else if (act.equals("delete")) {
                              if (!m.reported) {
                                  st.msgs.remove(m);
                                  st.dirty();
                              }
                              res(p, "Сообщение", "Сообщение удалено.", "inbox");
                          } else menuInbox(p);
                          break;
                      }
                      case "replyList":
                          if (inData) menuReplyInput(p, parseId(c.data.get(idx)));
                          break;
                      case "replyInput": {
                          String in = inputOf(r);
                          Store.Msg m = st.findMsg(parseId(c.extra));
                          if (m == null) res(p, "Ответить", "Сообщение уже недоступно.", "msgs");
                          else if (in.isEmpty()) res(p, "Ответить", "Ты не ввёл текст.", "msgs");
                          else res(p, "Ответить", sendReply(p, m, in), "msgs");
                          break;
                      }
                      case "af":
                          if (!isAdmin(p)) break;
                          if (idx == 0) menuAdmin(p);
                          else if (idx == 1) menuAdminReports(p);
                          else if (idx == 2) menuAdminGifts(p);
                          break;
                      case "afRep":
                          if (isAdmin(p) && inData) menuAdminReportView(p, parseId(c.data.get(idx)));
                          break;
                      case "afRepView": {
                          if (!isAdmin(p)) break;
                          Store.Msg m = st.findMsg(parseId(c.extra));
                          if (m != null && idx == 0) {
                              m.handled = true;
                              st.dirty();
                              resForm(p, "Жалоба", "Жалоба закрыта.", "af");
                          } else if (m != null && idx == 1) {
                              st.msgs.remove(m);
                              st.dirty();
                              resForm(p, "Жалоба", "Сообщение удалено.", "af");
                          } else {
                              menuAdminReports(p);
                          }
                          break;
                      }
                      case "add":
                          if (idx == 0) menuAddInput(p);
                          else if (idx == 1) menuAddOnline(p);
                          else if (idx == 2) menuMain(p);
                          break;
                      case "addInput": {
                          String in = inputOf(r);
                          if (in.isEmpty()) {
                              res(p, "Добавить друга", "Ты не ввёл ник.", "add");
                              break;
                          }
                          String[] t = resolve(in);
                          if (t == null) {
                              res(p, "Добавить друга", "Игрок «" + in + "» не найден. Он должен хотя бы раз зайти на сервер.", "add");
                          } else {
                              res(p, "Добавить друга", inviteFriend(p, t[0], t[1]), "add");
                          }
                          break;
                      }
                      case "addOnline":
                          if (inData) {
                              String tk = c.data.get(idx);
                              Player o = online(tk);
                              String nm = o != null ? o.getName() : tk;
                              res(p, "Добавить друга", inviteFriend(p, tk, nm), "add");
                          }
                          break;
                      case "invList":
                          if (inData) {
                              String[] parts = c.data.get(idx).split("\\|", 2);
                              if (parts.length == 2) menuInviteAct(p, parts[0], parts[1]);
                          }
                          break;
                      case "invAct": {
                          String[] parts = c.extra == null ? new String[0] : c.extra.split("\\|", 2);
                          if (parts.length != 2) break;
                          Store.Inv inv = findInv(parts[0], parts[1], k);
                          if (inv == null) {
                              res(p, "Приглашение", "Это приглашение уже недействительно.", "inv");
                          } else if (idx == 0) {
                              res(p, "Приглашение", acceptInv(p, inv), "inv");
                          } else {
                              res(p, "Приглашение", declineInv(p, inv), "inv");
                          }
                          break;
                      }
                      case "del":
                          if (inData) menuDeleteConfirm(p, c.data.get(idx));
                          break;
                      case "delConfirm":
                          if (idx == 0 && c.extra != null) {
                              res(p, "Удалить друга", removeFriend(p, c.extra), "main");
                          } else {
                              menuMain(p);
                          }
                          break;
                      case "res":
                          goBack(p, c.extra);
                          break;
                      default:
                          break;
                  }
              }
          }
          EOF_MAIN

      - name: Build with Maven
        run: mvn -B -q package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: EclipsFriends
          path: target/EclipsFriends.jar
          if-no-files-found: error
