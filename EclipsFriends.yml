              // ================== подарки, сообщения, телепорт ==================

              String dt(long ms) {
                  return Instant.ofEpochMilli(ms).atZone(zone).format(DF);
              }

              static String clean(String s) {
                  if (s == null) return "";
                  return s.replace("§", "").replace('\n', ' ').replace('\r', ' ').trim();
              }

              int msgLeft(Store.PD d) {
                  if (d.msgDay != today()) return msgLimit;
                  return Math.max(0, msgLimit - d.msgCount);
              }

              List<Store.Msg> inbox(String k) {
                  List<Store.Msg> r = new ArrayList<>();
                  for (Store.Msg m : st.msgs) {
                      if (m.to.equals(k)) r.add(m);
                  }
                  r.sort((a, b) -> Long.compare(b.created, a.created));
                  return r;
              }

              int unread(String k) {
                  int c = 0;
                  for (Store.Msg m : st.msgs) {
                      if (m.to.equals(k) && !m.read) c++;
                  }
                  return c;
              }

              void trimInbox(String k) {
                  List<Store.Msg> list = inbox(k);
                  Collections.reverse(list);
                  int over = list.size() - (msgStored - 1);
                  for (Store.Msg m : list) {
                      if (over <= 0) break;
                      if (m.reported && !m.handled) continue;
                      st.msgs.remove(m);
                      over--;
                  }
              }

              void notifyAdmins(String text) {
                  for (Player a : getServer().getOnlinePlayers().values()) {
                      if (isAdmin(a)) a.sendMessage(PFX + text);
                  }
              }

              String sendAnon(Player p, String tk, String raw) {
                  String me = key(p.getName());
                  Store.PD my = st.ensure(me, p.getName());
                  Store.PD t = st.players.get(tk);
                  if (t == null || !my.friends.contains(tk)) return "Сообщение можно отправить только другу.";
                  String text = clean(raw);
                  if (text.isEmpty()) return "Сообщение пустое.";
                  if (text.length() > msgMax) return "Слишком длинно: максимум " + msgMax + " символов (у тебя " + text.length() + ").";
                  long today = today();
                  if (my.msgDay != today) {
                      my.msgDay = today;
                      my.msgCount = 0;
                  }
                  if (my.msgCount >= msgLimit) {
                      return "Лимит: " + msgLimit + " анонимных сообщений в день. Новый день начнётся в 00:00.";
                  }
                  trimInbox(tk);
                  Store.Msg m = new Store.Msg();
                  m.id = st.newId();
                  m.type = "anon";
                  m.from = me;
                  m.fromName = p.getName();
                  m.to = tk;
                  m.toName = t.name;
                  m.text = text;
                  m.created = System.currentTimeMillis();
                  st.msgs.add(m);
                  my.msgCount++;
                  st.event("msg");
                  st.dirty();
                  if (msgLog) getLogger().info("[АНОН-СООБЩЕНИЕ] " + p.getName() + " -> " + t.name + ": " + text);
                  notifyPlayer(tk, "§aТебе пришло анонимное сообщение! §rОткрой §a/friend §r→ «Анонимные сообщения».");
                  return "Анонимное сообщение отправлено игроку " + t.name + ". Осталось сегодня: " + (msgLimit - my.msgCount) + ".";
              }

              String sendReply(Player p, Store.Msg orig, String raw) {
                  String me = key(p.getName());
                  if (!orig.to.equals(me) || !orig.type.equals("anon")) return "На это сообщение нельзя ответить.";
                  if (orig.replied) return "Ты уже ответил на это сообщение.";
                  Store.PD my = st.ensure(me, p.getName());
                  Store.PD t = st.players.get(orig.from);
                  if (t == null || !my.friends.contains(orig.from)) return "Автор сообщения больше не в твоих друзьях.";
                  String text = clean(raw);
                  if (text.isEmpty()) return "Ответ пустой.";
                  if (text.length() > msgMax) return "Слишком длинно: максимум " + msgMax + " символов (у тебя " + text.length() + ").";
                  trimInbox(orig.from);
                  Store.Msg m = new Store.Msg();
                  m.id = st.newId();
                  m.type = "reply";
                  m.from = me;
                  m.fromName = p.getName();
                  m.to = orig.from;
                  m.toName = t.name;
                  m.text = text;
                  m.created = System.currentTimeMillis();
                  st.msgs.add(m);
                  orig.replied = true;
                  st.dirty();
                  if (msgLog) getLogger().info("[ОТВЕТ] " + p.getName() + " -> " + t.name + ": " + text);
                  notifyPlayer(orig.from, "§aТебе ответили на анонимное сообщение! §rОткрой §a/friend §r→ «Анонимные сообщения».");
                  return "Ответ отправлен. Автор увидит, что отвечаешь ты.";
              }

              String reportMsg(Player p, Store.Msg m) {
                  if (!m.to.equals(key(p.getName()))) return "Это сообщение не для тебя.";
                  if (m.reported) return "Жалоба уже отправлена.";
                  m.reported = true;
                  m.handled = false;
                  st.dirty();
                  getLogger().warning("[ЖАЛОБА] " + p.getName() + " пожаловался на сообщение от " + m.fromName + ": " + m.text);
                  notifyAdmins("§cЖалоба на сообщение: §e" + m.fromName + " §r→ §e" + m.toName + "§r. Подробности: §a/af");
                  return "Жалоба отправлена администрации. Спасибо!";
              }

